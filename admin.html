<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لوحة الإدارة | اعرف شخصيتك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/style.css">
<style>.wrap{max-width:60rem}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{width:auto;padding:8px 14px;font-size:14px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.k{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center}.k b{font-size:26px;display:block}td button{padding:4px 8px;font-size:12px;width:auto;display:inline-block}input,textarea,select{text-align:right}.sm{width:auto;display:inline-block}</style></head><body><div class="wrap">
<div class="top"><span class="logo">⚙️ لوحة الإدارة</span><button class="icon" id="out">خروج</button></div>
<div id="login" class="card c"><h2>دخول المسؤول</h2><input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password"><button class="btn" id="lg" style="margin-top:10px">دخول</button><p class="msg e" id="lm"></p></div>
<div id="app" class="hidden"><div class="tabs" id="tabs"></div><div id="pane"></div></div></div>
<script>
const $=s=>document.querySelector(s);let T=sessionStorage.getItem('aaref_admin')||'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?new Date(d).toLocaleString('ar-KW'):'-';
async function A(action,o){const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:JSON.stringify(Object.assign({action},o||{}))});if(r.status===401&&action!=='login'){logout();throw 0}return r.json()}
function logout(){sessionStorage.removeItem('aaref_admin');T='';$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}
$('#out').onclick=logout;
$('#lg').onclick=async()=>{const r=await A('login',{password:$('#pw').value});if(r.ok){T=r.token;sessionStorage.setItem('aaref_admin',T);$('#pw').value='';start()}else $('#lm').textContent=r.error==='rate'?'محاولات كثيرة، انتظر.':'كلمة السر غير صحيحة'};
const TABS={stats:'الإحصائيات',requests:'طلبات الدفع',codes:'الأكواد',subs:'الاشتراكات',users:'المستخدمون',questions:'الأسئلة',content:'المحتوى'};
function start(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="btn alt" data-t="${k}">${v}</button>`).join('');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>show(b.dataset.t));show('stats')}
const AX={thinking:'التفكير',people:'التعامل مع الآخرين',feelings:'المشاعر',goals:'الطموح',stress:'الضغوط',confidence:'الثقة',lifestyle:'أسلوب الحياة',strengths:'القوة والتحديات'};
const TN={A:'المحلل',S:'الاجتماعي',E:'صاحب القلب',M:'الطموح',C:'الهادئ',F:'الواثق',V:'المغامر',D:'المنظّم'};
async function show(t){const p=$('#pane');p.innerHTML='<div class="spin"></div>';
 try{
 if(t==='stats'){const r=await A('stats');p.innerHTML=`<div class="g">${[['المستخدمون',r.users],['جدد (7 أيام)',r.newUsers7],['نشطون (7 أيام)',r.activeUsers7],['إجمالي الاختبارات',r.totalTests],['نسبة الإكمال',r.completionRate+'%'],['اشتراكات نشطة',r.activeSubs],['اشتراكات منتهية',r.expiredSubs],['اشتراكات جديدة (30 يوم)',r.newSubs30],['تحويل مجاني ← مدفوع',r.conversion+'%'],['إيرادات الشهر (د.ك)',r.monthRevenueKWD],['طلبات معلقة',r.pendingRequests]].map(([a,b])=>`<div class="k"><b>${b}</b>${a}</div>`).join('')}</div><div class="card" style="margin-top:12px"><h3>توزيع الأنواع</h3>${Object.entries(r.types).map(([k,v])=>`<p>${TN[k]}: ${v}</p>`).join('')||'<p class="mut">لا توجد بيانات بعد</p>'}</div><p class="mut">الإيرادات تقدير: عدد الاشتراكات المفعّلة هذا الشهر × 1 د.ك لكل 30 يوم.</p>`}
 if(t==='requests'){const r=await A('requests');p.innerHTML=`<div class="card"><table><tr><th>التاريخ</th><th>الواتساب</th><th>الحالة</th><th></th></tr>${r.requests.map(x=>`<tr><td>${fd(x.created_at)}</td><td dir="ltr">${esc(x.contact)}</td><td>${x.status}${x.code?' '+esc(x.code):''}</td><td>${x.status==='pending'?`<button class="btn" data-ap="${x.id}">موافقة وإصدار كود</button> <button class="btn alt" data-rj="${x.id}">رفض</button>`:''}</td></tr>`).join('')}</table></div><div id="out2"></div>`;
  p.querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{const r=await A('approveRequest',{id:b.dataset.ap,days:30});$('#out2').innerHTML=r.ok?`<div class="card"><p>الكود: <b dir="ltr">${r.code}</b> للرقم <span dir="ltr">${esc(r.contact)}</span></p><a class="btn wa" target="_blank" href="https://wa.me/${r.contact.replace(/\D/g,'')}?text=${encodeURIComponent('كود تفعيل اعرف شخصيتك: '+r.code+'\nأدخله في صفحة الاشتراك. صالح لمرة وحدة (30 يوم).')}">إرسال الكود عبر واتساب</a></div>`:'<p class="msg e">تعذر</p>'});
  p.querySelectorAll('[data-rj]').forEach(b=>b.onclick=async()=>{await A('rejectRequest',{id:b.dataset.rj});show('requests')})}
 if(t==='codes'){const r=await A('codes');p.innerHTML=`<div class="card"><h3>إنشاء أكواد</h3><input class="sm" id="cn" type="number" value="1" min="1" max="20" style="width:80px"> كود، <input class="sm" id="cd" type="number" value="30" style="width:80px"> يوم <input class="sm" id="cnote" placeholder="ملاحظة" style="width:160px"><button class="btn sm" id="mk" style="width:auto;display:inline-block">إنشاء</button><div id="newc"></div></div><div class="card"><table><tr><th>الكود</th><th>الأيام</th><th>الحالة</th><th>ملاحظة</th><th></th></tr>${r.codes.map(c=>`<tr><td dir="ltr">${c.code}</td><td>${c.days}</td><td>${c.revoked?'ملغي':c.redeemed_at?'مستخدم '+fd(c.redeemed_at):'جاهز'}</td><td>${esc(c.note)}</td><td>${!c.revoked&&!c.redeemed_at?`<button class="btn alt" data-rv="${c.code}">إلغاء</button>`:''}</td></tr>`).join('')}</table></div>`;
  $('#mk').onclick=async()=>{const r=await A('createCode',{count:$('#cn').value,days:$('#cd').value,note:$('#cnote').value});$('#newc').innerHTML=r.ok?'<p dir="ltr">'+r.codes.join('<br>')+'</p>':'';setTimeout(()=>show('codes'),4000)};
  p.querySelectorAll('[data-rv]').forEach(b=>b.onclick=async()=>{await A('revokeCode',{code:b.dataset.rv});show('codes')})}
 if(t==='subs'){const r=await A('subs');p.innerHTML=`<div class="card"><table><tr><th>الجهاز</th><th>من</th><th>إلى</th><th>الحالة</th><th></th></tr>${r.subs.map(s=>`<tr><td dir="ltr">${s.device_short}</td><td>${fd(s.starts_at)}</td><td>${fd(s.ends_at)}</td><td>${s.cancelled?'ملغي':s.active?'فعال':'منتهي'}</td><td><button class="btn alt" data-ex="${s.id}">+30 يوم</button> ${s.cancelled?'':`<button class="btn alt" data-cx="${s.id}">إلغاء</button>`}</td></tr>`).join('')}</table></div>`;
  p.querySelectorAll('[data-ex]').forEach(b=>b.onclick=async()=>{await A('extendSub',{id:b.dataset.ex,days:30});show('subs')});p.querySelectorAll('[data-cx]').forEach(b=>b.onclick=async()=>{if(confirm('إلغاء الاشتراك؟')){await A('cancelSub',{id:b.dataset.cx});show('subs')}})}
 if(t==='users'){const r=await A('users');p.innerHTML=`<div class="card"><p class="mut">الأجهزة المجهولة (بدون أسماء ولا إيميلات).</p><table><tr><th>الجهاز</th><th>اختبارات</th><th>آخر نشاط</th><th>النوع</th><th>اشتراك حتى</th></tr>${r.users.map(u=>`<tr><td dir="ltr">${u.device}</td><td>${u.tests}</td><td>${fd(u.last)}</td><td>${u.type?TN[u.type[0]]+'':'-'}</td><td>${u.sub?fd(u.sub):'-'}</td></tr>`).join('')}</table></div>`}
 if(t==='questions'){const r=await A('questions');if(!r.questions.length){await A('seedQuestions');return show('questions')}
  p.innerHTML=`<div class="card"><button class="btn" id="nq">+ سؤال جديد</button></div><div id="qf"></div><div class="card"><table><tr><th>#</th><th>المحور</th><th>السؤال</th><th></th></tr>${r.questions.map(q=>`<tr><td>${q.id}</td><td>${AX[q.axis]||q.axis}</td><td>${esc(q.text)}${q.active?'':' (مخفي)'}</td><td><button class="btn alt" data-e="${q.id}">تعديل</button> <button class="btn alt" data-d="${q.id}">حذف</button></td></tr>`).join('')}</table></div>`;
  const form=q=>{$('#qf').innerHTML=`<div class="card"><select id="qa">${Object.entries(AX).map(([k,v])=>`<option value="${k}" ${q.axis===k?'selected':''}>${v}</option>`).join('')}</select><textarea id="qt" rows="2" placeholder="نص السؤال">${esc(q.text||'')}</textarea><p class="mut">الخيارات: كل سطر "نص الخيار | الأوزان" مثل <span dir="ltr">A3D1</span> (A تحليل، S اجتماعي، E عاطفة، M طموح، C هدوء، F ثقة، V تجديد، D انضباط)</p><textarea id="qo" rows="5">${esc((q.options||[]).map(o=>o.t+' | '+o.w).join('\n'))}</textarea><label><input type="checkbox" id="qac" ${q.active!==false?'checked':''} class="sm" style="width:auto"> مفعّل</label><button class="btn" id="qs">حفظ</button></div>`;
   $('#qs').onclick=async()=>{const options=$('#qo').value.split('\n').map(l=>l.split('|')).filter(a=>a[0].trim()).map(a=>({t:a[0].trim(),w:(a[1]||'').trim()}));const r=await A('saveQuestion',{question:{id:q.id,axis:$('#qa').value,text:$('#qt').value,options,active:$('#qac').checked}});if(r.ok)show('questions');else alert('تأكد من تعبئة الحقول (خيارين على الأقل)')}};
  $('#nq').onclick=()=>form({});p.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>form(r.questions.find(x=>x.id==b.dataset.e)));p.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('حذف السؤال؟')){await A('deleteQuestion',{id:b.dataset.d});show('questions')}})}
 if(t==='content'){const r=await A('content');const m={};r.content.forEach(c=>m[c.key]=c.value);
  p.innerHTML=Object.entries(TN).map(([k,n])=>`<div class="card"><h3>${n}</h3>${[['n','الاسم'],['tag','الجملة القصيرة'],['d','الوصف']].map(([f,l])=>`<label class="mut">${l}</label><textarea rows="${f==='d'?3:1}" data-k="arch.${k}.${f}" placeholder="فارغ = النص الافتراضي">${esc(m['arch.'+k+'.'+f]||'')}</textarea>`).join('')}<label class="mut">طريقة التفكير</label><textarea rows="2" data-k="think.${k}" placeholder="فارغ = النص الافتراضي">${esc(m['think.'+k]||'')}</textarea></div>`).join('')+'<button class="btn" id="sv">حفظ التعديلات</button><p class="mut">الأقسام المدفوعة نصوصها على الخادم وتتعدل من الكود.</p>';
  $('#sv').onclick=async()=>{for(const e of p.querySelectorAll('[data-k]')){if((m[e.dataset.k]||'')!==e.value)await A('saveContent',{key:e.dataset.k,value:e.value})}alert('تم الحفظ (يظهر خلال دقيقة)');show('content')}}
 }catch(e){if(e)p.innerHTML='<p class="msg e">تعذر التحميل</p>'}}
if(T)start();
</script></body></html>
